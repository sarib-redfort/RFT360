services:
  postgres:
    image: postgres:16-alpine
    container_name: rft360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rft360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rft360_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rft360}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rft360} -d ${POSTGRES_DB:-rft360}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rft360-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Mailpit captures outbound email in development.
  # Open http://localhost:8025 to read messages the app "sends".
  mailpit:
    image: axllent/mailpit:latest
    container_name: rft360-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  redis_data:
