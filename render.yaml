# ==============================================================================
# RFT360 — Render Blueprint (free tier)
#
# Deploys BOTH services: the NestJS API and the Next.js site. Postgres lives on
# Neon and Redis on Upstash, because Render's own free Postgres expires after
# 30 days.
#
# Because both services are on Render their URLs are deterministic, so the
# cross-references between them are hardcoded rather than prompted.
#
# Import with: Render Dashboard -> New -> Blueprint -> pick this repo.
# Values marked `sync: false` are prompted for on import and never committed.
# ==============================================================================
services:
  - type: web
    name: rft360-api
    runtime: node
    plan: free
    # Keep this in the same geography as the database. Every request makes
    # several round trips to Postgres, so a Render instance in Oregon talking to
    # a Neon project in us-east-2 pays ~60-80ms of transit on each one.
    # `ohio` == AWS us-east-2. Change both together, never just one.
    region: ohio
    branch: main

    # `--include=dev` is REQUIRED: NODE_ENV=production (set below) makes `npm ci`
    # skip devDependencies, which is where the Nest CLI, TypeScript, Prisma CLI
    # and ts-node live — the build fails without them.
    #
    # Order matters: @rft360/shared compiles first (the API imports its built
    # output), then the Prisma client is generated, then Nest compiles to dist/.
    # Migrations run as the LAST build step rather than via `preDeployCommand`,
    # because pre-deploy commands are a paid-instance feature — on the free plan
    # they are ignored, and the app would boot against a schema-less database.
    # Render exposes env vars (incl. DATABASE_URL) during builds, and
    # `migrate deploy` only applies pending migrations and never resets data, so
    # it is safe to repeat on every build.
    # Seeding is a ONE-TIME manual step — see DEPLOY.md.
    buildCommand: >-
      npm ci --include=dev &&
      npm run build --workspace=@rft360/shared &&
      npm run db:generate --workspace=@rft360/api &&
      npm run build --workspace=@rft360/api &&
      npm run db:deploy --workspace=@rft360/api

    startCommand: node apps/api/dist/main.js

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api

      # Render injects PORT itself; the API prefers it over API_PORT.

      # --- Connections (paste from Neon / Upstash) ---------------------------
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      # --- Secrets (Render generates these; never hand-written) --------------
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # The web service reads this via `fromService`, so the two can never
      # drift. Prompted rather than generated so you can reuse an existing value.
      - key: REVALIDATE_SECRET
        sync: false

      # --- Origins ----------------------------------------------------------
      # Both point at the web service below. Because both services are on
      # Render its URL is deterministic (<name>.onrender.com), so these are
      # fixed rather than prompted — which removes the chicken-and-egg where
      # the API needed a URL that did not exist yet.
      # WEB_URL is where publish webhooks go (wrong = CMS edits never reach the
      # site); CORS_ORIGINS is the browser allowlist (wrong = the public contact
      # and job-application forms fail).
      # If Render appends a suffix because a name was taken, correct these.
      - key: WEB_URL
        value: https://rft360-web.onrender.com
      - key: CORS_ORIGINS
        value: https://rft360-web.onrender.com
      - key: API_URL
        value: https://rft360-api.onrender.com

      # --- Storage (Supabase Storage; see DEPLOY.md step 3) -----------------
      # s3 is MANDATORY here: Render's filesystem is wiped on every deploy, so
      # `local` silently loses every uploaded image.
      - key: STORAGE_DRIVER
        value: s3
      # https://<PROJECT_REF>.storage.supabase.co/storage/v1/s3
      - key: S3_ENDPOINT
        sync: false
      # The project's real region (e.g. us-east-1), NOT "auto" — it is part of
      # the SigV4 signature, so a wrong value fails as a signature error.
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Different host from S3_ENDPOINT:
      # https://<PROJECT_REF>.supabase.co/storage/v1/object/public/<bucket>
      - key: S3_PUBLIC_URL
        sync: false
      # Supabase does not serve buckets as subdomains — must stay true here.
      # (Cloudflare R2 wants false.)
      - key: S3_FORCE_PATH_STYLE
        value: true
      - key: MAX_UPLOAD_SIZE_MB
        value: 10

      # --- Mail (Gmail app password, Resend, Brevo, …) -----------------------
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_NOTIFY_TO
        sync: false

      # --- First CMS administrator (used by the one-time seed) --------------
      # The API refuses to boot in production if the password is still the
      # default `ChangeMe123!`.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: RFT360 Administrator

  # ===========================================================================
  # Next.js site + CMS. Runs as a normal Node server (`next start`), which needs
  # no adapter — the start script omits `-p` so Next binds to Render's $PORT.
  # ===========================================================================
  - type: web
    name: rft360-web
    runtime: node
    plan: free
    region: ohio
    branch: main

    # Turbo builds @rft360/shared first (dependsOn ^build); the web app imports
    # its compiled output, so a bare `next build` fails here.
    buildCommand: >-
      npm ci --include=dev &&
      npx turbo run build --filter=@rft360/web

    startCommand: npm run start --workspace=@rft360/web

    envVars:
      # NODE_ENV is deliberately NOT set: `next build` and `next start` each set
      # it correctly, and forcing it breaks prerendering of /404 and /500.
      # robots.txt, sitemap.xml and the canonical/OG tags are PRERENDERED, so
      # this must be correct at BUILD time. `RENDER_EXTERNAL_URL` is a runtime
      # variable and cannot be relied on during the build, so set it explicitly
      # — the URL is deterministic because the service name is fixed.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://rft360-web.onrender.com

      - key: NEXT_PUBLIC_API_URL
        value: https://rft360-api.onrender.com/api/v1
      - key: API_INTERNAL_URL
        value: https://rft360-api.onrender.com/api/v1

      # Pulled from the API rather than prompted, because it must equal
      # S3_PUBLIC_URL exactly: it is what allowlists the media host for
      # next/image and in the CSP. Left blank or mismatched, uploads succeed and
      # every image renders as a broken fallback with a 400 from /_next/image —
      # a failure with no obvious connection to its cause.
      - key: NEXT_PUBLIC_MEDIA_URL
        fromService:
          type: web
          name: rft360-api
          envVarKey: S3_PUBLIC_URL

      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: true

      # Pulled from the API service so the two can never drift. A mismatch here
      # makes CMS publishes save fine and silently never reach the live site.
      - key: REVALIDATE_SECRET
        fromService:
          type: web
          name: rft360-api
          envVarKey: REVALIDATE_SECRET
